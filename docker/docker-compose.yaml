version: "3.8"

services:
  my_project:
    build:
      context: ../
      dockerfile: ./docker/app/Dockerfile
    container_name: spring-project
    ports:
      - "8080:8080"
    volumes:
      - ../:/app
    env_file:
      - ../.env

  redis:
    build:
      context: ../
      dockerfile: docker/redis/Dockerfile
    container_name: redis-project
    ports:
      - "6379:6379"

  mysql:
    build:
      context: ../
      dockerfile: docker/mysql/Dockerfile
    container_name: mysql-project
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data:
